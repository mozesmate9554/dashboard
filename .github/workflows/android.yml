name: Native builds and project checks

on:
  push:
    branches: [main, 'release/**']
    paths-ignore: ['documentation/**', 'tests/results/**', 'README.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    if: "!startsWith(github.event.head_commit.message, 'Package verified SIM CONTROL STUDIO 0.3.0')"
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile_flutter
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: SDK versions and dependencies
        run: |
          mkdir -p ../ci-results
          flutter --version --machine > ../ci-results/flutter-version.json
          flutter pub get
          python3 -c 'import json,pathlib; print(json.dumps({"dependencyLock":pathlib.Path("pubspec.lock").read_text()}))'
          python3 -c 'import os,json; json.dump({"commit":os.environ["GITHUB_SHA"],"runId":os.environ["GITHUB_RUN_ID"],"url":"https://github.com/"+os.environ["GITHUB_REPOSITORY"]+"/actions/runs/"+os.environ["GITHUB_RUN_ID"]},open("../ci-results/provenance.json","w"))'
      - name: Profile and native-project data validation
        working-directory: .
        run: python3 tests/validate_profiles.py
      - name: Dart analyzer
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee ../ci-results/flutter-analyze.log
      - name: Flutter tests
        run: |
          set -o pipefail
          flutter test --machine 2>&1 | tee ../ci-results/flutter-tests.jsonl
      - name: Review actual Flutter Skoda renders
        if: always()
        working-directory: .
        run: |
          python3 -m pip install pillow==12.0.0
          python3 tools/preview_review.py preview-build
      - name: Upload high resolution Skoda previews
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Skoda-previews-${{ github.sha }}
          path: preview-build/
          if-no-files-found: error
          retention-days: 30
      - name: Prepare isolated preview signing key
        env:
          STUDIO_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STUDIO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          key_path="$RUNNER_TEMP/simcontrol-release.jks"
          if [[ -n "$STUDIO_KEYSTORE_BASE64" ]]; then
            if [[ -z "$STUDIO_KEYSTORE_PASSWORD" ]]; then
              echo 'ANDROID_KEYSTORE_PASSWORD is required with the configured keystore.' >&2
              exit 1
            fi
            printf '%s' "$STUDIO_KEYSTORE_BASE64" | base64 --decode > "$key_path"
            key_password="$STUDIO_KEYSTORE_PASSWORD"
            key_kind=stable_repository_secret
          else
            key_password="$(openssl rand -hex 24)"
            echo "::add-mask::$key_password"
            export STUDIO_TEMP_KEY_PASSWORD="$key_password"
            keytool -genkeypair -keystore "$key_path" -storepass:env STUDIO_TEMP_KEY_PASSWORD -keypass:env STUDIO_TEMP_KEY_PASSWORD -alias simcontrol -keyalg RSA -keysize 3072 -validity 10000 -dname 'CN=SIM CONTROL STUDIO Preview'
            key_kind=ephemeral_preview_reinstall_required_between_runs
          fi
          chmod 600 "$key_path"
          echo "SIMCONTROL_KEYSTORE=$key_path" >> "$GITHUB_ENV"
          echo "SIMCONTROL_KEYSTORE_PASSWORD=$key_password" >> "$GITHUB_ENV"
          echo "{\"kind\":\"$key_kind\",\"privateKeyIncludedInArtifact\":false}" > ../ci-results/signing.json
      - name: Build actual signed release APK
        run: |
          set -o pipefail
          chmod +x android/gradlew
          flutter build apk --release 2>&1 | tee ../ci-results/android-build.log
          test -s build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/flutter-apk/app-release.apk > ../ci-results/APK-SHA256.txt
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$build_tools/apksigner" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk | tee ../ci-results/APK-SIGNATURE.txt
          "$build_tools/aapt" dump badging build/app/outputs/flutter-apk/app-release.apk > ../ci-results/APK-BADGING.txt
      - name: Upload installable APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SIM_CONTROL_STUDIO-Android-${{ github.sha }}
          path: mobile_flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload actual check results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Android-check-results-${{ github.sha }}
          path: |
            ci-results/
            mobile_flutter/pubspec.lock
            tests/results/profile-tests.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/simcontrol-release.jks"

  windows:
    if: "!startsWith(github.event.head_commit.message, 'Package verified SIM CONTROL STUDIO 0.3.0')"
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Remove earlier Windows reports
        run: Remove-Item tests/results/windows-*.json -ErrorAction SilentlyContinue
      - name: Bridge tests on Windows
        run: dotnet run --project tests/Bridge.Tests -c Release -- tests/results/windows-bridge-tests.json
      - name: Real TLS transport benchmark with synthetic DEMO
        run: dotnet run --project tests/Bridge.Benchmarks -c Release -- tests/results/windows-transport-benchmark.json
      - name: Publish self-contained Windows x64 application
        run: dotnet publish windows_bridge/Bridge.Windows -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o _staging/Windows
      - name: Build actual Windows installer
        shell: pwsh
        run: |
          Copy-Item documentation/licenses _staging/Windows/Licenses -Recurse
          $compiler = 'C:\Program Files (x86)\NSIS\makensis.exe'
          if (-not (Test-Path $compiler)) { choco install nsis --yes --no-progress }
          if (-not (Test-Path $compiler)) { throw 'NSIS compiler unavailable' }
          $appDir = (Resolve-Path _staging/Windows).Path
          $setupFile = Join-Path $env:GITHUB_WORKSPACE 'SIM_CONTROL_STUDIO_0.3.0_Setup_x64.exe'
          & $compiler /WX /V2 "/DAPPDIR=$appDir" "/DOUTPUT=$setupFile" tools/windows-installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path $setupFile)) { throw 'Setup executable missing' }
          Compress-Archive -Path _staging/Windows/* -DestinationPath SIM_CONTROL_STUDIO_0.3.0_Windows_x64.zip
      - name: Smoke test installer and WinForms startup on Windows
        shell: pwsh
        run: |
          $setupFile = Join-Path $env:GITHUB_WORKSPACE 'SIM_CONTROL_STUDIO_0.3.0_Setup_x64.exe'
          $install = Start-Process $setupFile -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw 'Silent installation failed' }
          $installDir = Join-Path $env:LOCALAPPDATA 'Programs\SimControlStudio'
          $exe = Join-Path $installDir 'SimControlStudio.Bridge.exe'
          if (-not (Test-Path $exe)) { throw 'Installed executable missing' }
          $app = Start-Process $exe -PassThru
          try {
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Milliseconds 300
              $app.Refresh()
              if ($app.HasExited) { throw 'Bridge exited during startup' }
              if ($app.MainWindowHandle -ne 0) { break }
            }
            if ($app.MainWindowTitle -notlike '*SIM CONTROL STUDIO 0.3.0*') { throw "Unexpected application window: $($app.MainWindowTitle)" }
            @{ version = '0.3.0'; install = 'passed'; winFormsStartup = 'passed'; windowTitle = $app.MainWindowTitle; realGameInput = 'not_tested' } | ConvertTo-Json | Set-Content tests/results/windows-installer-smoke.json
          } finally { if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force } }
          Get-Content tests/results/windows-installer-smoke.json
          Start-Process (Join-Path $installDir 'Uninstall.exe') -ArgumentList '/S' -Wait
      - name: Upload Windows executables
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SIM_CONTROL_STUDIO-Windows-${{ github.sha }}
          path: |
            SIM_CONTROL_STUDIO_0.3.0_Windows_x64.zip
            SIM_CONTROL_STUDIO_0.3.0_Setup_x64.exe
          if-no-files-found: error
          retention-days: 30
      - name: Upload Windows check results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Windows-check-results-${{ github.sha }}
          path: tests/results/windows-*.json
          retention-days: 30

  android-native:
    if: "!startsWith(github.event.head_commit.message, 'Package verified SIM CONTROL STUDIO 0.3.0')"
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile_flutter
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Prepare actual Android 16 emulator
        run: |
          mkdir -p ../android-ci
          flutter pub get
          sudo chmod 666 /dev/kvm
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          sdkmanager 'platform-tools' 'emulator' 'platforms;android-36' 'system-images;android-36;google_apis;x86_64' > ../android-ci/sdk-install.log
          export ANDROID_USER_HOME="$RUNNER_TEMP/studio-android-user"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd -p "$ANDROID_AVD_HOME/studio.avd" -n studio -k 'system-images;android-36;google_apis;x86_64' --device pixel_7
          "$ANDROID_HOME/emulator/emulator" -avd studio -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -memory 2048 -cores 2 > ../android-ci/emulator.log 2>&1 &
          test -f "$ANDROID_AVD_HOME/studio.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds
          timeout 120 adb wait-for-device || { cat ../android-ci/emulator.log; exit 1; }
          timeout 240 bash -c 'until [[ "$(adb shell getprop sys.boot_completed | tr -d "\r")" == 1 ]]; do sleep 2; done' || { cat ../android-ci/emulator.log; exit 1; }
          adb shell input keyevent 82
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb reverse tcp:19759 tcp:19759
          adb reverse tcp:19760 tcp:19760
          adb shell getprop ro.build.version.release > ../android-ci/android-version.txt
          adb shell getprop ro.build.version.sdk > ../android-ci/android-api.txt
      - name: Native Android TLS, Keystore, controls and actual system bar visibility
        env:
          STUDIO_NATIVE_OUTPUT: android-ci
        run: |
          set -o pipefail
          dotnet run --project ../tests/Mobile.BridgeFixture -c Release > "$RUNNER_TEMP/studio-android-fixture.log" 2>&1 &
          studio_fixture_pid=$!
          trap 'kill "$studio_fixture_pid" 2>/dev/null || true' EXIT
          studio_fixture_ready=0
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:19759/session > /dev/null; then studio_fixture_ready=1; break; fi
            sleep 1
          done
          if [[ "$studio_fixture_ready" != 1 ]]; then cat "$RUNNER_TEMP/studio-android-fixture.log"; exit 1; fi
          flutter drive --driver=test_driver/native_driver.dart --target=integration_test/native_bridge_test.dart -d emulator-5554 2>&1 | tee ../android-ci/native-bridge-integration.log
          python3 -c 'import os,json; json.dump({"version":"0.3.0","commit":os.environ["GITHUB_SHA"],"physicalAndroidTest":False,"nativeApi":36,"orientationAndSystemBars":"passed","tlsKeystoreTelemetryTouchReconnect":"passed"},open("../android-ci/provenance.json","w"),indent=2)'
      - name: Upload native Android evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Android-native-${{ github.sha }}
          path: android-ci/
          if-no-files-found: error
          retention-days: 30

  ios:
    if: "!startsWith(github.event.head_commit.message, 'Package verified SIM CONTROL STUDIO 0.3.0')"
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile_flutter
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Record actual Apple build environment
        run: |
          mkdir -p ../ios-ci
          xcodebuild -version | tee ../ios-ci/xcode-version.txt
          xcodebuild -showsdks > ../ios-ci/apple-sdks.txt
          flutter --version --machine > ../ios-ci/flutter-version.json
          flutter pub get
          plutil -lint ios/Runner/Info.plist ios/Runner/Runner.entitlements ios/Runner.xcodeproj/project.pbxproj
      - name: Build real iOS Simulator application
        run: |
          set -o pipefail
          flutter build ios --simulator --debug --no-pub 2>&1 | tee ../ios-ci/simulator-build.log
          test -d build/ios/iphonesimulator/Runner.app
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app ../ios-ci/SIM_CONTROL_STUDIO_0.3.0_iOS_Simulator.zip
      - name: Install and launch on an available iPhone simulator
        run: |
          xcrun simctl list devices available --json > ../ios-ci/simulator-devices.json
          studio_simulator=$(python3 -c 'import json; j=json.load(open("../ios-ci/simulator-devices.json")); devices=[d for runtime,ds in sorted(j["devices"].items(),key=lambda item:("iOS-18-5" in item[0],item[0]),reverse=True) if "iOS" in runtime for d in ds if d.get("isAvailable") and "iPhone" in d["name"]]; assert devices,"No iPhone simulator available"; print(devices[0]["udid"])')
          echo "STUDIO_SIMULATOR=$studio_simulator" >> "$GITHUB_ENV"
          python3 -c 'import subprocess,sys; subprocess.run(["xcrun","simctl","boot",sys.argv[1]],timeout=60); subprocess.run(["xcrun","simctl","bootstatus",sys.argv[1],"-b"],check=True,timeout=360)' "$studio_simulator"
          xcrun simctl install "$studio_simulator" build/ios/iphonesimulator/Runner.app
          launch_output=$(xcrun simctl launch "$studio_simulator" hu.simcontrol.studio)
          printf '%s\n' "$launch_output" | tee ../ios-ci/simulator-launch.txt
          studio_process=$(printf '%s' "$launch_output" | sed -E 's/.*: ([0-9]+).*/\1/')
          sleep 5
          kill -0 "$studio_process"
          xcrun simctl io "$studio_simulator" screenshot ../ios-ci/iphone-startup.png
          python3 -c 'import os,json; json.dump({"version":"0.3.0","commit":os.environ["GITHUB_SHA"],"runUrl":"https://github.com/"+os.environ["GITHUB_REPOSITORY"]+"/actions/runs/"+os.environ["GITHUB_RUN_ID"],"simulatorInstall":"passed","simulatorLaunch":"passed","physicalIphoneTest":False,"signedIpa":False,"testFlight":False},open("../ios-ci/provenance.json","w"),indent=2)'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Native iOS TLS, Keychain, telemetry and command integration
        run: |
          set -o pipefail
          dotnet run --project ../tests/Mobile.BridgeFixture -c Release > "$RUNNER_TEMP/studio-native-fixture.log" 2>&1 &
          studio_fixture_pid=$!
          trap 'kill "$studio_fixture_pid" 2>/dev/null || true' EXIT
          studio_fixture_ready=0
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:19759/session > /dev/null; then studio_fixture_ready=1; break; fi
            sleep 1
          done
          if [[ "$studio_fixture_ready" != 1 ]]; then cat "$RUNNER_TEMP/studio-native-fixture.log"; exit 1; fi
          flutter drive --driver=test_driver/native_driver.dart --target=integration_test/native_bridge_test.dart -d "$STUDIO_SIMULATOR" 2>&1 | tee ../ios-ci/native-bridge-integration.log
      - name: Build iPhone ARM64 release without signing
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign --no-pub --target lib/main.dart 2>&1 | tee ../ios-ci/device-unsigned-build.log
          test -d build/ios/iphoneos/Runner.app
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app ../ios-ci/SIM_CONTROL_STUDIO_0.3.0_iOS_Unsigned_NotInstallable.zip
      - name: Upload actual iOS outputs and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SIM_CONTROL_STUDIO-iOS-${{ github.sha }}
          path: ios-ci/
          if-no-files-found: error
          retention-days: 30

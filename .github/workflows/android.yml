name: Android APK and project checks

on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile_flutter
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: SDK versions and dependencies
        run: |
          mkdir -p ../ci-results
          flutter --version --machine > ../ci-results/flutter-version.json
          flutter pub get
          python3 -c 'import os,json; json.dump({"commit":os.environ["GITHUB_SHA"],"runId":os.environ["GITHUB_RUN_ID"],"url":"https://github.com/"+os.environ["GITHUB_REPOSITORY"]+"/actions/runs/"+os.environ["GITHUB_RUN_ID"]},open("../ci-results/provenance.json","w"))'
      - name: Profile and native-project data validation
        working-directory: .
        run: python3 tests/validate_profiles.py
      - name: Dart analyzer
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee ../ci-results/flutter-analyze.log
      - name: Flutter tests
        run: |
          set -o pipefail
          flutter test --machine 2>&1 | tee ../ci-results/flutter-tests.jsonl
      - name: Prepare isolated preview signing key
        env:
          STUDIO_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STUDIO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          key_path="$RUNNER_TEMP/simcontrol-release.jks"
          if [[ -n "$STUDIO_KEYSTORE_BASE64" ]]; then
            if [[ -z "$STUDIO_KEYSTORE_PASSWORD" ]]; then
              echo 'ANDROID_KEYSTORE_PASSWORD is required with the configured keystore.' >&2
              exit 1
            fi
            printf '%s' "$STUDIO_KEYSTORE_BASE64" | base64 --decode > "$key_path"
            key_password="$STUDIO_KEYSTORE_PASSWORD"
            key_kind=stable_repository_secret
          else
            key_password="$(openssl rand -hex 24)"
            echo "::add-mask::$key_password"
            export STUDIO_TEMP_KEY_PASSWORD="$key_password"
            keytool -genkeypair -keystore "$key_path" -storepass:env STUDIO_TEMP_KEY_PASSWORD -keypass:env STUDIO_TEMP_KEY_PASSWORD -alias simcontrol -keyalg RSA -keysize 3072 -validity 10000 -dname 'CN=SIM CONTROL STUDIO Preview'
            key_kind=ephemeral_preview_reinstall_required_between_runs
          fi
          chmod 600 "$key_path"
          echo "SIMCONTROL_KEYSTORE=$key_path" >> "$GITHUB_ENV"
          echo "SIMCONTROL_KEYSTORE_PASSWORD=$key_password" >> "$GITHUB_ENV"
          echo "{\"kind\":\"$key_kind\",\"privateKeyIncludedInArtifact\":false}" > ../ci-results/signing.json
      - name: Build actual signed release APK
        run: |
          set -o pipefail
          chmod +x android/gradlew
          flutter build apk --release 2>&1 | tee ../ci-results/android-build.log
          test -s build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/flutter-apk/app-release.apk > ../ci-results/APK-SHA256.txt
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$build_tools/apksigner" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk | tee ../ci-results/APK-SIGNATURE.txt
          "$build_tools/aapt" dump badging build/app/outputs/flutter-apk/app-release.apk > ../ci-results/APK-BADGING.txt
      - name: Upload installable APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SIM_CONTROL_STUDIO-Android-${{ github.sha }}
          path: mobile_flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload actual check results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Android-check-results-${{ github.sha }}
          path: |
            ci-results/
            mobile_flutter/pubspec.lock
            tests/results/profile-tests.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/simcontrol-release.jks"

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release SIM CONTROL STUDIO 0.2.0')
    needs: [android, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: SIM_CONTROL_STUDIO-Android-${{ github.sha }}
          path: _release-input/Android
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: SIM_CONTROL_STUDIO-Windows-${{ github.sha }}
          path: _release-input/Windows
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Android-check-results-${{ github.sha }}
          path: _release-input/Android-checks
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Windows-check-results-${{ github.sha }}
          path: tests/results
      - name: Package only actual verified build outputs
        run: |
          mkdir -p _staging/Windows
          unzip -q _release-input/Windows/SIM_CONTROL_STUDIO_0.2.0_Windows_x64.zip -d _staging/Windows
          cp _release-input/Android-checks/mobile_flutter/pubspec.lock mobile_flutter/pubspec.lock
          python3 tools/release_status.py --checks _release-input/Android-checks/ci-results
          python3 tools/package_release.py --output _release-output --windows _staging/Windows --apk _release-input/Android/app-release.apk --installer _release-input/Windows/SIM_CONTROL_STUDIO_0.2.0_Setup_x64.exe --checks _release-input/Android-checks/ci-results
      - name: Publish downloadable 0.2.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v0.2.0 --target "$GITHUB_SHA" --title "SIM CONTROL STUDIO 0.2.0" --notes-file documentation/RELEASE_0.2.0.md _release-output/*.apk _release-output/*.exe _release-output/*.zip _release-output/SHA256SUMS.txt

  windows:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Bridge tests on Windows
        run: dotnet run --project tests/Bridge.Tests -c Release -- tests/results/windows-bridge-tests.json
      - name: Real TLS transport benchmark with synthetic DEMO
        run: dotnet run --project tests/Bridge.Benchmarks -c Release -- tests/results/windows-transport-benchmark.json
      - name: Publish self-contained Windows x64 application
        run: dotnet publish windows_bridge/Bridge.Windows -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o _staging/Windows
      - name: Build actual Windows installer
        shell: pwsh
        run: |
          Copy-Item documentation/licenses _staging/Windows/Licenses -Recurse
          $compiler = 'C:\Program Files (x86)\NSIS\makensis.exe'
          if (-not (Test-Path $compiler)) { choco install nsis --yes --no-progress }
          if (-not (Test-Path $compiler)) { throw 'NSIS compiler unavailable' }
          $appDir = (Resolve-Path _staging/Windows).Path
          $setupFile = Join-Path $env:GITHUB_WORKSPACE 'SIM_CONTROL_STUDIO_0.2.0_Setup_x64.exe'
          & $compiler /WX /V2 "/DAPPDIR=$appDir" "/DOUTPUT=$setupFile" tools/windows-installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path $setupFile)) { throw 'Setup executable missing' }
          Compress-Archive -Path _staging/Windows/* -DestinationPath SIM_CONTROL_STUDIO_0.2.0_Windows_x64.zip
      - name: Smoke test installer and WinForms startup on Windows
        shell: pwsh
        run: |
          $setupFile = Join-Path $env:GITHUB_WORKSPACE 'SIM_CONTROL_STUDIO_0.2.0_Setup_x64.exe'
          $install = Start-Process $setupFile -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw 'Silent installation failed' }
          $installDir = Join-Path $env:LOCALAPPDATA 'Programs\SimControlStudio'
          $exe = Join-Path $installDir 'SimControlStudio.Bridge.exe'
          if (-not (Test-Path $exe)) { throw 'Installed executable missing' }
          $app = Start-Process $exe -PassThru
          try {
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Milliseconds 300
              $app.Refresh()
              if ($app.HasExited) { throw 'Bridge exited during startup' }
              if ($app.MainWindowHandle -ne 0) { break }
            }
            if ($app.MainWindowTitle -notlike '*SIM CONTROL STUDIO 0.2.0*') { throw "Unexpected application window: $($app.MainWindowTitle)" }
            @{ version = '0.2.0'; install = 'passed'; winFormsStartup = 'passed'; windowTitle = $app.MainWindowTitle; realGameInput = 'not_tested' } | ConvertTo-Json | Set-Content tests/results/windows-installer-smoke.json
          } finally { if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force } }
          Start-Process (Join-Path $installDir 'Uninstall.exe') -ArgumentList '/S' -Wait
      - name: Upload Windows executables
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SIM_CONTROL_STUDIO-Windows-${{ github.sha }}
          path: |
            SIM_CONTROL_STUDIO_0.2.0_Windows_x64.zip
            SIM_CONTROL_STUDIO_0.2.0_Setup_x64.exe
          if-no-files-found: error
          retention-days: 30
      - name: Upload Windows check results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Windows-check-results-${{ github.sha }}
          path: tests/results/windows-*.json
          retention-days: 30

name: sim_control_studio
description: Private, offline native motorsport dashboards and button boxes.
publish_to: none
version: 0.3.0+3
environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'
dependencies:
  flutter:
    sdk: flutter
  shared_preferences: 2.5.3
  flutter_secure_storage: 9.2.4
  file_picker: 10.3.3
  mobile_scanner: 7.1.3
  wakelock_plus: 1.4.0
  flutter_svg: 2.2.1
  crypto: 3.0.6
  path_provider: 2.1.5
  share_plus: 11.1.0
  cross_file: 0.3.4+2
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/catalog.json
